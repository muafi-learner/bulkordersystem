<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kasir - Kintoun Cafe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00263F', ivory: '#EEEBE1', taupe: '#908371', 
                        secondary: '#3C586D', coolGrey: '#C0C9CE', muted: '#B8AD98', lightBeige: '#D6CFBF'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-ivory text-primary font-sans min-h-screen flex flex-col" onload="initDashboard()">

    <header class="bg-primary text-ivory p-5 shadow-lg flex justify-between items-center sticky top-0 z-20 rounded-b-3xl mb-6 mx-2 md:mx-6 mt-2">
        <div>
            <h1 class="text-xl font-bold tracking-tight">Kintoun Order System</h1>
            <p class="text-coolGrey text-xs font-medium mt-1">Auto-sync aktif • Kasir Dashboard</p>
        </div>
        <div class="flex items-center space-x-4">
            <span id="statusConnection" class="text-xs font-bold tracking-wider uppercase bg-green-500 text-white px-3 py-1.5 rounded-full shadow-sm">Online</span>
            <button onclick="fetchOrders()" class="bg-secondary hover:bg-taupe text-ivory px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm hidden md:block">
                Refresh Data
            </button>
        </div>
    </header>

    <div id="audioNotice" class="mx-4 md:mx-8 mb-6 bg-white p-4 rounded-xl border border-lightBeige shadow-sm flex items-center justify-between cursor-pointer hover:bg-gray-50 transition" onclick="enableAudio(this)">
        <p class="text-sm text-secondary font-medium"><span class="font-bold">🔔 Penting:</span> Klik kotak ini satu kali agar notifikasi suara pesanan baru bisa berbunyi.</p>
        <span class="text-taupe font-bold text-xl">›</span>
    </div>

    <main class="flex-grow px-4 md:px-8 pb-10">
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <p class="text-taupe col-span-full text-center py-20 font-medium">Menyinkronkan data pesanan...</p>
        </div>
    </main>

    <div id="loadingOverlay" class="fixed inset-0 bg-primary bg-opacity-80 backdrop-blur-sm hidden flex-col justify-center items-center z-[60]">
        <div class="w-12 h-12 border-4 border-ivory border-t-taupe rounded-full animate-spin mb-4"></div>
        <p class="font-bold text-ivory tracking-wide">Memperbarui Status...</p>
    </div>

    <div id="customConfirmModal" class="fixed inset-0 bg-primary bg-opacity-70 backdrop-blur-sm hidden flex-col justify-center items-center z-[70] px-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl border border-lightBeige w-full max-w-sm overflow-hidden transform transition-all">
            <div class="p-6">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="bg-secondary bg-opacity-10 p-2 rounded-full text-secondary">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-primary">Konfirmasi Status</h3>
                </div>
                <p id="confirmMessage" class="text-secondary text-sm font-medium leading-relaxed"></p>
            </div>
            <div class="bg-ivory px-6 py-4 flex justify-end space-x-3 border-t border-lightBeige">
                <button onclick="closeConfirmModal()" class="px-4 py-2 rounded-xl text-sm font-bold text-taupe hover:bg-lightBeige transition">Batal</button>
                <button id="btnConfirmAction" class="px-4 py-2 rounded-xl text-sm font-bold bg-primary text-ivory hover:bg-secondary transition shadow-md">Ya, Ubah Status</button>
            </div>
        </div>
    </div>

<script>
    const N8N_GET_ORDERS_URL = 'https://n8n-h238.srv1866922.hstgr.cloud/webhook/get-orders'; 
    const N8N_UPDATE_STATUS_URL = 'https://n8n-h238.srv1866922.hstgr.cloud/webhook-test/pesanan-diproses-kak';

    let knownOrdersCount = 0; 
    let audioContext = null;
    let pendingAction = null;

    function enableAudio(element) {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        element.style.display = 'none';
    }

    function playDing() {
        if (!audioContext) return; 
        if (audioContext.state === 'suspended') audioContext.resume();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(850, audioContext.currentTime); 
        gainNode.gain.setValueAtTime(0.8, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4); 
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.4);
    }

    async function fetchOrders() {
        const statusBadge = document.getElementById('statusConnection');
        statusBadge.innerText = 'Syncing...';
        statusBadge.className = 'text-xs font-bold tracking-wider uppercase bg-taupe text-white px-3 py-1.5 rounded-full shadow-sm';

        try {
            const response = await fetch(N8N_GET_ORDERS_URL + '?t=' + new Date().getTime(), { 
                headers: { 'Accept': 'application/json' }
            });
            const rawData = await response.json();

            const orders = rawData.map(item => ({
                id: item['ID Pesanan'],
                timestamp: item['Waktu'],
                name: item['Nama'],
                wa: item['No WA'],
                address: item['Alamat'],
                orders: item['Detail Pesanan'],
                total: parseInt(item['Total'] || 0),
                payment: item['Pembayaran'],
                proofUrl: item['Bukti URL'],
                status: item['Status']
            }));

            const reversedOrders = orders.reverse();
            renderOrders(reversedOrders);

            if (knownOrdersCount !== 0 && orders.length > knownOrdersCount) playDing(); 
            knownOrdersCount = orders.length;

            statusBadge.innerText = 'Online';
            statusBadge.className = 'text-xs font-bold tracking-wider uppercase bg-secondary text-white px-3 py-1.5 rounded-full shadow-sm';
        } catch (error) {
            statusBadge.innerText = 'Offline';
            statusBadge.className = 'text-xs font-bold tracking-wider uppercase bg-red-800 text-white px-3 py-1.5 rounded-full shadow-sm';
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        let activeOrdersCount = 0;
        let html = '';

        orders.forEach(order => {
            if(order.status === 'Selesai') return; 
            activeOrdersCount++;

            const orderListHtml = order.orders ? order.orders.replace(/\n/g, '<br>') : '';
            let statusUI = order.status === 'Pesanan Masuk' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-ivory text-secondary border-lightBeige';
            let cardAccent = order.status === 'Pesanan Masuk' ? 'border-t-4 border-t-red-400' : 'border-t-4 border-t-secondary';
            
            // Format data aman untuk dikirim lewat parameter fungsi
            const safeId = order.id ? order.id.replace(/'/g, "\\'") : '';
            const safeWa = order.wa ? String(order.wa).replace(/'/g, "\\'") : '';
            const safeName = order.name ? order.name.replace(/'/g, "\\'") : '';

            html += `
            <div class="bg-white rounded-2xl shadow-sm border border-lightBeige flex flex-col ${cardAccent} overflow-hidden transition hover:shadow-md">
                <div class="p-5 border-b border-lightBeige flex justify-between items-start">
                    <div>
                        <span class="font-extrabold text-xs text-taupe tracking-wider">${order.id || '-'}</span>
                        <p class="text-xs text-coolGrey font-medium mt-1">${order.timestamp || '-'}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border ${statusUI}">${order.status || '-'}</span>
                </div>

                <div class="p-5 flex-grow">
                    <h3 class="font-bold text-xl text-primary mb-1">${order.name || '-'}</h3>
                    <p class="text-secondary text-sm font-medium mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        ${order.wa || '-'}
                    </p>
                    <div class="bg-ivory p-3 rounded-xl border border-lightBeige mb-4">
                        <p class="font-bold text-[10px] text-taupe uppercase tracking-wider mb-1">Alamat Pengiriman</p>
                        <p class="text-primary text-sm font-medium leading-relaxed">${order.address || '-'}</p>
                    </div>
                    <div class="mb-4">
                        <p class="font-bold text-[10px] text-taupe uppercase tracking-wider mb-2">Detail Pesanan</p>
                        <p class="text-primary text-sm font-semibold leading-relaxed pl-2 border-l-2 border-secondary">${orderListHtml}</p>
                    </div>
                </div>

                <div class="p-5 bg-white border-t border-lightBeige space-y-3">
                    ${order.status === 'Pesanan Masuk' ? `<button onclick="updateStatus('${safeId}', 'Sedang Diproses', '${safeWa}', '${safeName}')" class="w-full bg-primary text-ivory py-3 rounded-xl text-sm font-bold hover:bg-secondary transition shadow-md">Proses Pesanan</button>` : ''}
                    ${order.status === 'Sedang Diproses' ? `<button onclick="updateStatus('${safeId}', 'Selesai', '${safeWa}', '${safeName}')" class="w-full bg-secondary text-ivory py-3 rounded-xl text-sm font-bold hover:bg-primary transition shadow-md">Tandai Selesai & Kirim</button>` : ''}
                </div>
            </div>`;
        });

        if(activeOrdersCount === 0) {
            container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20"><p class="text-secondary font-semibold">Belum ada pesanan aktif.</p></div>`;
        } else {
            container.innerHTML = html;
        }
    }

    function closeConfirmModal() {
        document.getElementById('customConfirmModal').classList.add('hidden');
        document.getElementById('customConfirmModal').classList.remove('flex');
        pendingAction = null;
    }

    function updateStatus(orderId, newStatus, customerWA, customerName) {
        console.log("Tombol di-klik, membuka popup untuk:", orderId);
        const modal = document.getElementById('customConfirmModal');
        const message = document.getElementById('confirmMessage');
        message.innerHTML = `Ubah status pesanan <span class="font-bold text-primary">${orderId}</span> menjadi <span class="font-bold text-primary">"${newStatus}"</span>?`;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        pendingAction = { orderId, newStatus, customerWA, customerName };
    }

    // Pindahkan listener tombol "Ya, Ubah Status" keluar agar tidak bertumpuk
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('btnConfirmAction').addEventListener('click', function() {
            console.log("Tombol konfirmasi YA di-klik!");
            
            // 1. Eksekusi fetch dulu selagi data pendingAction masih ada
            if(pendingAction) {
                executeStatusUpdate(pendingAction.orderId, pendingAction.newStatus, pendingAction.customerWA, pendingAction.customerName);
            }
            
            // 2. Baru tutup pop-up (yang akan me-reset pendingAction menjadi null)
            closeConfirmModal();
        });
    });

    async function executeStatusUpdate(orderId, newStatus, customerWA, customerName) {
        console.log("Memulai proses fetch ke n8n...");
        document.getElementById('loadingOverlay').classList.remove('hidden');
        document.getElementById('loadingOverlay').classList.add('flex');

        try {
            let formattedWA = String(customerWA).trim();
            if (formattedWA.startsWith('0')) formattedWA = '62' + formattedWA.substring(1);
            else if (!formattedWA.startsWith('62')) formattedWA = '62' + formattedWA;

            const n8nPayload = { 
                orderId: String(orderId), 
                status: String(newStatus), 
                nomor_wa: formattedWA, 
                nama: String(customerName)
            };

            console.log("Payload yang dikirim:", n8nPayload);

            const response = await fetch(N8N_UPDATE_STATUS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(n8nPayload)
            });

            console.log("Status respons n8n:", response.status);

            if (response.ok) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('flex');
                fetchOrders(); 
            } else {
                throw new Error("Status API: " + response.status);
            }
        } catch (error) {
            console.error("Gagal melakukan fetch:", error);
            alert('Gagal update ke n8n. Cek tab Console untuk detail.');
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }
    }

    function initDashboard() {
        document.body.addEventListener('click', () => {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }, { once: true });
        fetchOrders(); 
        setInterval(fetchOrders, 10000); 
    }
</script>
</body>
</html>
